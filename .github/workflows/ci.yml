
name: EstateFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-ci:
    name: Backend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --no-audit --no-fund

      - name: Test M15 AI and Staff/GM
        run: npm run test:m15

      - name: Test M16 Ollama
        run: npm run test:m16

      - name: Test M30 Concierge Extraction
        run: npx ts-node --transpile-only test/m30-concierge-structured-facts.unit.ts

      - name: Test M31 Conversation Memory
        run: npx ts-node --transpile-only test/m31-concierge-conversation-memory.unit.ts

      - name: Test M32 Ollama Rewrite
        run: npx ts-node --transpile-only test/m32-ollama-guest-rewrite.unit.ts

      - name: Build NestJS Backend
        run: npm run build

  frontend-ci:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React Frontend
        run: npm run build

      - name: Verify Frontend Build Output
        run: test -f .output/server/index.mjs

  ci-success:
    name: CI Validation Complete
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: All Checks Passed
        run: echo "EstateFlow frontend and backend CI passed!"
